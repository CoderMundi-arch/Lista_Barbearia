<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Fila de atendimento do Studio Anadison O Mágico. Entre na fila e acompanhe sua vez." />
    <title>Fila de atendimento · Studio Anadison O Mágico</title>

    <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="page-public">
    <!-- Cabeçalho -->
    <header class="brand container container--narrow">
      <div class="brand__logo">
        <img src="assets/img/logo-studio.jpg" width="598" height="486" alt="Logo do Studio Anadison O Mágico" data-bind="logoAlt" />
      </div>
      <div class="brand__text">
        <h1 class="brand__title" data-bind="businessName">Studio Anadison O Mágico</h1>
        <p class="brand__subtitle" data-bind="tagline">Organize seu atendimento</p>
        <p class="brand__date">
          <i data-icon="calendar-days"></i>
          <time data-bind="date"></time>
        </p>
      </div>
    </header>

    <main class="container container--narrow stack">
      <!-- Ação principal -->
      <section id="register" class="register reveal" style="--delay: 60ms" aria-label="Cadastro">
        <button type="button" id="open-register" class="btn btn--primary btn--xl">
          <i data-icon="user-plus"></i>
          Cadastrar nome
        </button>
        <p id="full-notice" class="register__full" role="status" hidden>
          <i data-icon="lock"></i>
          Lista completa por hoje. Fale com a barbearia.
        </p>
      </section>

      <!-- Lista de atendimento -->
      <section id="list-section" class="card list-card reveal" aria-labelledby="list-title" style="--delay: 120ms">
        <div class="list-head">
          <div>
            <h2 id="list-title" class="section-title">Lista de hoje</h2>
            <p class="section-hint">Ordem de chegada · atualiza sozinha</p>
          </div>
          <span id="count-pill" class="count-pill" title="Vagas preenchidas">0/30</span>
        </div>

        <ol id="client-list" class="client-list" aria-label="Lista de atendimento" hidden></ol>

        <div id="empty-state" class="empty">
          <div class="empty__icon"><i data-icon="armchair"></i></div>
          <p class="empty__title">Nenhum nome ainda</p>
          <p id="empty-text" class="empty__text">Toque em “Cadastrar nome” para entrar na lista de hoje.</p>
        </div>
      </section>

      <p class="footnote">
        <i data-icon="rotate-ccw"></i>
        A lista é reiniciada automaticamente a cada novo dia.
      </p>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/icons.js"></script>
    <script src="assets/js/rules.js"></script>
    <script src="assets/js/repository.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/public.js"></script>
  </body>
</html>
